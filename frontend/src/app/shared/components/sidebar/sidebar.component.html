<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  
  <div class="sidebar-content">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <h3 class="sidebar-title">
        <span class="title-icon">{{ isAdmin ? '⚙️' : '📋' }}</span>
        {{ isAdmin ? 'Administration' : 'Mon Espace' }}
      </h3>
      <button class="btn-close" (click)="closeSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Sidebar Menu - Admin -->
    <nav class="sidebar-nav" *ngIf="isAdmin">
      <ul class="nav-list">
        <li>
          <a (click)="navigate('/admin')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/admin/resources')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span>Gestion des Ressources</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/admin/reservations')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Gestion des Réservations</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/admin/users')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Gestion des Utilisateurs</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/admin/statistics')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
            <span>Statistiques</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Sidebar Menu - User -->
    <nav class="sidebar-nav" *ngIf="!isAdmin">
      <ul class="nav-list">
        <li>
          <a (click)="navigate('/users/user-home')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Accueil</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/users/reservations')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <span>Mes Réservations</span>
          </a>
        </li>
        <li>
          <a (click)="navigate('/users/reservations/new')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <span>Nouvelle Réservation</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>
