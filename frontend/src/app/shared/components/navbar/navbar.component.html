<nav class="navbar">
  <div class="navbar-container">
    <!-- Menu Toggle (Mobile & Desktop) -->
    <div *ngIf="this.isUser">
    <button  class="menu-toggle" (click)="toggleSidebar()" *ngIf="isLoggedIn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button></div>

    <!-- Logo -->
    <div class="navbar-brand">
      <a routerLink="/">
        <span class="logo-icon"></span>
        <span class="logo-text">ReservationApp</span>
      </a>
    </div>

    <!-- User Actions -->
    <div class="navbar-actions">
      <div *ngIf="isLoggedIn" class="user-info">
        <div class="user-profile">
          <div class="user-avatar" [class.admin-avatar]="isAdmin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="user-details">
            <span class="user-name">{{ userPrenom }} {{ userNom }}</span>
            <span class="user-role" [class.admin-role]="isAdmin">{{ userRole }}</span>
          </div>
        </div>
        <button class="btn-logout" (click)="logout()" title="Déconnexion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
      <div *ngIf="!isLoggedIn" class="auth-buttons">
        <a routerLink="/login" class="btn-login">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Connexion
        </a>
        <a routerLink="/register" class="btn-register">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          Inscription
        </a>
      </div>
    </div>
  </div>
</nav>
