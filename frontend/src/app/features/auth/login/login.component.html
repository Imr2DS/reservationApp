
<div class="auth-container">
  <div class="auth-card">
    <!-- Logo et titre -->
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h2 class="auth-title">Connexion</h2>
      <p class="auth-subtitle">Connectez-vous à votre compte ReservaApp</p>
    </div>

    <!-- Message d'erreur -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Formulaire de connexion -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">
      <!-- Email -->
      <div class="form-group">
        <label class="form-label form-label-required">Email</label>
        <div class="form-input-group">
          <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input 
            type="email"
            name="email"
            class="form-input"
            placeholder="votre@email.com"
            [(ngModel)]="email"
            required
            email
            #emailInput="ngModel"
            [class.is-invalid]="emailInput.invalid && emailInput.touched">
        </div>
        <div class="form-feedback is-invalid" *ngIf="emailInput.invalid && emailInput.touched">
          <svg class="form-feedback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span *ngIf="emailInput.errors?.['required']">L'email est requis</span>
          <span *ngIf="emailInput.errors?.['email']">Format d'email invalide</span>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label class="form-label form-label-required">Mot de passe</label>
        <div class="form-input-group">
          <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            [type]="showPassword ? 'text' : 'password'"
            name="motDePasse"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="motDePasse"
            required
            minlength="6"
            #passwordInput="ngModel"
            [class.is-invalid]="passwordInput.invalid && passwordInput.touched">
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePassword()">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="form-feedback is-invalid" *ngIf="passwordInput.invalid && passwordInput.touched">
          <svg class="form-feedback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span *ngIf="passwordInput.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="passwordInput.errors?.['minlength']">Minimum 6 caractères requis</span>
        </div>
      </div>

      <!-- Se souvenir de moi / Mot de passe oublié -->
      <div class="auth-options">
        
        <a href="#" class="auth-link">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton de connexion -->
      <button 
        type="submit" 
        class="btn btn-primary btn-block btn-lg"
        [class.btn-loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" *ngIf="!isLoading">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>

    <!-- Lien vers l'inscription -->
    <div class="auth-footer">
      <p>Vous n'avez pas de compte ?</p>
      <button 
        type="button" 
        class="btn btn-outline btn-block"
        (click)="goToRegister()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        Créer un compte
      </button>
    </div>

    <!-- Divider -->
    <div class="auth-divider">
      <span>Ou continuer avec</span>
    </div>

    <!-- Boutons sociaux -->
    <div class="social-auth">
      <button type="button" class="btn-social btn-google">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button type="button" class="btn-social btn-microsoft">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zm12.6 0H12.6V0H24v11.4z" fill="#00A4EF"/>
        </svg>
        Microsoft
      </button>
    </div>
  </div>
</div>

<app-footer></app-footer>
