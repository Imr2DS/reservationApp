<!-- Navbar -->
<app-navbar (sidebarToggle)="toggleSidebar()"></app-navbar>

<!-- Sidebar -->
<app-sidebar [isOpen]="isSidebarOpen" (close)="closeSidebar()"></app-sidebar>

<div class="form-container">
  <!-- Header -->
  <div class="page-header">
    <button class="btn-back" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>
    <h1>{{ isEditMode ? 'Modifier la ressource' : 'Créer une ressource' }}</h1>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <form [formGroup]="resourceForm" (ngSubmit)="submit()">
      
      <!-- Nom -->
      <div class="form-group">
        <label class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Nom de la ressource
          <span class="required">*</span>
        </label>
        <input 
          type="text"
          formControlName="nom" 
          class="form-input"
          placeholder="Ex: Salle de réunion A1"
          [class.error]="resourceForm.get('nom')?.touched && resourceForm.get('nom')?.invalid"
        />
        <div class="error-message" *ngIf="resourceForm.get('nom')?.touched && resourceForm.get('nom')?.invalid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Le nom est requis
        </div>
      </div>

      <!-- Type -->
      <div class="form-group">
        <label class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Type
          <span class="required">*</span>
        </label>
        <select 
          formControlName="type"
          class="form-select"
          [class.error]="resourceForm.get('type')?.touched && resourceForm.get('type')?.invalid"
        >
          <option value="">-- Choisir un type --</option>
          <option *ngFor="let type of resourceTypes" [value]="type">{{ type }}</option>
          <option value="AUTRE">➕ Autre (nouveau type)</option>
        </select>
        <div class="error-message" *ngIf="resourceForm.get('type')?.touched && resourceForm.get('type')?.invalid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Le type est requis
        </div>
      </div>

      <!-- Autre type (conditionnel) -->
      <div class="form-group" *ngIf="resourceForm.get('type')?.value === 'AUTRE'">
        <label class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          Nouveau type
          <span class="required">*</span>
        </label>
        <input 
          type="text"
          formControlName="otherType" 
          class="form-input"
          placeholder="Ex: Équipement sportif"
          [class.error]="resourceForm.get('otherType')?.touched && resourceForm.get('otherType')?.invalid"
        />
        <div class="error-message" *ngIf="resourceForm.get('otherType')?.touched && resourceForm.get('otherType')?.invalid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Le nouveau type est requis
        </div>
      </div>

      <!-- Capacité -->
      <div class="form-group">
        <label class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Capacité
          <span class="required">*</span>
        </label>
        <input 
          type="number" 
          formControlName="capacite"
          class="form-input"
          placeholder="Nombre de personnes"
          min="1"
          [class.error]="resourceForm.get('capacite')?.touched && resourceForm.get('capacite')?.invalid"
        />
        <div class="error-message" *ngIf="resourceForm.get('capacite')?.touched && resourceForm.get('capacite')?.invalid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          La capacité doit être d'au moins 1 personne
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          Description
        </label>
        <textarea 
          formControlName="description"
          class="form-textarea"
          placeholder="Description détaillée de la ressource (optionnel)"
          rows="4"
        ></textarea>
      </div>

      <!-- Error Message -->
      <div class="alert-error" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="goBack()" [disabled]="loading">
          Annuler
        </button>
        <button type="submit" class="btn-submit" [disabled]="loading || resourceForm.invalid">
          <svg *ngIf="!loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <div *ngIf="loading" class="btn-spinner"></div>
          {{ isEditMode ? 'Mettre à jour' : 'Créer la ressource' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Footer -->
<app-footer></app-footer>
