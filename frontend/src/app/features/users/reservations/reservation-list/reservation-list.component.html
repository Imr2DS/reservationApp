<div *ngIf="reservations.length === 0">
  <p>Aucune réservation</p>
</div>

<table *ngIf="reservations.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Start</th>
      <th>End</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of reservations">
      <td>{{ r.id }}</td>
      <td>{{ r.startDate }}</td>
      <td>{{ r.endDate }}</td>
      <td>{{ r.status }}</td>
      <td>
        <button (click)="viewDetails(r.id)">Détails</button>
        <button (click)="editReservation(r.id)">Modifier</button>
        <button (click)="deleteReservation(r.id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
