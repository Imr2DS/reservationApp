version: "3.8"

services:

  # ===============================
  # CONFIG SERVER
  # ===============================
  config-service:
    build:
      context: ./reservation_system/config-server
    image: reservationapp-config-server
    container_name: config-service
    ports:
      - "8888:8888"
    volumes:
      - ./reservation_system/config-server/config-repo:/config-repo
    restart: unless-stopped
    networks:
      - reservation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # DISCOVERY (EUREKA)
  # ===============================
  discovery-service:
    build:
      context: ./reservation_system/discovery-service
    image: reservationapp-discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    depends_on:
      config-service:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # API GATEWAY
  # ===============================
  api-gateway:
    build:
      context: ./reservation_system/api-gateway
    image: reservationapp-api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # USER SERVICE
  # ===============================
  user-service:
    build:
      context: ./reservation_system/user_service
    image: reservationapp-user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      user-db:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://user-db:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: imrane
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # RESOURCE SERVICE
  # ===============================
  resource-service:
    build:
      context: ./reservation_system/ressource_service
    image: reservationapp-resource-service
    container_name: resource-service
    ports:
      - "8082:8082"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      resource-db:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://resource-db:3306/resource_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: imrane
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # RESERVATION SERVICE
  # ===============================
  reservation-service:
    build:
      context: ./reservation_system/reservation_service
    image: reservationapp-reservation-service
    container_name: reservation-service
    ports:
      - "8083:8083"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_started
      reservation-db:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://reservation-db:3306/reservation_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: imrane
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # FRONTEND ANGULAR (NGINX)
  # ===============================
  frontend:
    build:
      context: ./frontend
    image: reservationapp-frontend
    container_name: reservation-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - reservation-network

  # ===============================
  # DATABASES
  # ===============================
  user-db:
    image: mysql:8
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: imrane
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - reservation-network

  resource-db:
    image: mysql:8
    container_name: resource-db
    environment:
      MYSQL_ROOT_PASSWORD: imrane
      MYSQL_DATABASE: resource_db
    ports:
      - "3308:3306"
    volumes:
      - resource-db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - reservation-network

  reservation-db:
    image: mysql:8
    container_name: reservation-db
    environment:
      MYSQL_ROOT_PASSWORD: imrane
      MYSQL_DATABASE: reservation_db
    ports:
      - "3309:3306"
    volumes:
      - reservation-db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - reservation-network

volumes:
  user-db-data:
  resource-db-data:
  reservation-db-data:

networks:
  reservation-network:
    driver: bridge
